name: Noah Nvidia checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --workspace @noah-nvidia/web
        working-directory: .
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 .venv
      - run: uv pip install -r requirements-dev.txt --python .venv/bin/python
      - run: .venv/bin/python -m pytest -q
      - run: .venv/bin/python -m compileall -q .
      - run: .venv/bin/python ../../scripts/smoke_api.py
      - run: .venv/bin/python ../../scripts/export_openapi.py
      - run: git diff --exit-code -- contracts/openapi.yaml
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git diff --check
      - run: python scripts/check_secrets.py
