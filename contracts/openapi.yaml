components:
  schemas:
    BusinessPatch:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 160
            minLength: 1
          - type: 'null'
          title: Name
        locale:
          anyOf:
          - type: string
            maxLength: 20
            minLength: 2
          - type: 'null'
          title: Locale
        timezone:
          anyOf:
          - type: string
            maxLength: 80
            minLength: 3
          - type: 'null'
          title: Timezone
        currency:
          anyOf:
          - type: string
            maxLength: 3
            minLength: 3
          - type: 'null'
          title: Currency
        working_hours:
          anyOf:
          - {}
          - type: 'null'
          title: Working Hours
        authority_policy:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Authority Policy
      type: object
      title: BusinessPatch
    ContactCreate:
      properties:
        name:
          type: string
          maxLength: 160
          minLength: 1
          title: Name
        email:
          anyOf:
          - type: string
            maxLength: 320
          - type: 'null'
          title: Email
        company:
          anyOf:
          - type: string
            maxLength: 160
          - type: 'null'
          title: Company
        notes:
          type: string
          maxLength: 4000
          title: Notes
          default: ''
      type: object
      required:
      - name
      title: ContactCreate
    ConversationCreate:
      properties:
        title:
          type: string
          maxLength: 120
          minLength: 1
          title: Title
          default: Operations desk
      type: object
      title: ConversationCreate
    DecisionRequest:
      properties:
        reason:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Reason
        expected_hash:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 32
          - type: 'null'
          title: Expected Hash
      type: object
      title: DecisionRequest
    DocumentCreate:
      properties:
        filename:
          type: string
          maxLength: 240
          minLength: 1
          title: Filename
        content_type:
          type: string
          maxLength: 120
          minLength: 1
          title: Content Type
        content:
          type: string
          maxLength: 7000000
          title: Content
          default: ''
        content_base64:
          anyOf:
          - type: string
            maxLength: 7000000
          - type: 'null'
          title: Content Base64
      type: object
      required:
      - filename
      - content_type
      title: DocumentCreate
    DraftCreate:
      properties:
        to:
          type: string
          maxLength: 320
          minLength: 3
          title: To
        subject:
          type: string
          maxLength: 240
          minLength: 1
          title: Subject
        body:
          type: string
          maxLength: 20000
          minLength: 1
          title: Body
      type: object
      required:
      - to
      - subject
      - body
      title: DraftCreate
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LedgerCreate:
      properties:
        kind:
          type: string
          enum:
          - income
          - expense
          title: Kind
        description:
          type: string
          maxLength: 240
          minLength: 1
          title: Description
        category:
          type: string
          maxLength: 120
          minLength: 1
          title: Category
        amount_minor:
          type: integer
          maximum: 1000000000.0
          minimum: 0.0
          title: Amount Minor
        currency:
          type: string
          maxLength: 3
          minLength: 3
          title: Currency
          default: USD
        occurred_on:
          type: string
          title: Occurred On
        source_document_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Document Id
        status:
          type: string
          enum:
          - proposed
          - confirmed
          title: Status
          default: proposed
      type: object
      required:
      - kind
      - description
      - category
      - amount_minor
      title: LedgerCreate
    MessageRequest:
      properties:
        message:
          type: string
          maxLength: 8000
          minLength: 1
          title: Message
      type: object
      required:
      - message
      title: MessageRequest
    OnboardingBusiness:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 160
            minLength: 1
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
            maxLength: 1000
            minLength: 1
          - type: 'null'
          title: Description
        category:
          anyOf:
          - type: string
            maxLength: 120
            minLength: 1
          - type: 'null'
          title: Category
        timezone:
          anyOf:
          - type: string
            maxLength: 64
            minLength: 1
          - type: 'null'
          title: Timezone
        currency:
          anyOf:
          - type: string
            pattern: ^[A-Z]{3}$
          - type: 'null'
          title: Currency
        locale:
          anyOf:
          - type: string
            pattern: ^[a-z]{2}(?:-[A-Z]{2})?$
          - type: 'null'
          title: Locale
      additionalProperties: false
      type: object
      required:
      - name
      - description
      - category
      - timezone
      - currency
      - locale
      title: OnboardingBusiness
    OnboardingCompleteRequest:
      properties:
        draft:
          $ref: '#/components/schemas/OnboardingDraft'
        confirmation:
          type: string
          const: confirm
          title: Confirmation
      additionalProperties: false
      type: object
      required:
      - draft
      - confirmation
      title: OnboardingCompleteRequest
      description: The reviewed draft plus an explicit human confirmation.
    OnboardingCompleteResponse:
      properties:
        onboarding:
          $ref: '#/components/schemas/OnboardingState'
        business:
          additionalProperties: true
          type: object
          title: Business
        inventory:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Inventory
        idempotent:
          type: boolean
          title: Idempotent
          default: false
      additionalProperties: false
      type: object
      required:
      - onboarding
      - business
      - inventory
      title: OnboardingCompleteResponse
    OnboardingDraft:
      properties:
        schema_version:
          type: string
          const: onboarding.v1
          title: Schema Version
        business:
          $ref: '#/components/schemas/OnboardingBusiness'
        inventory:
          items:
            $ref: '#/components/schemas/OnboardingInventoryItem'
          type: array
          maxItems: 100
          title: Inventory
        missing_fields:
          items:
            type: string
            enum:
            - business.name
            - business.description
            - business.category
            - business.timezone
            - business.currency
            - business.locale
            - inventory
          type: array
          title: Missing Fields
      additionalProperties: false
      type: object
      required:
      - schema_version
      - business
      - inventory
      - missing_fields
      title: OnboardingDraft
    OnboardingExtractRequest:
      properties:
        text:
          type: string
          maxLength: 4000
          minLength: 12
          title: Text
      additionalProperties: false
      type: object
      required:
      - text
      title: OnboardingExtractRequest
    OnboardingExtractionResponse:
      properties:
        draft:
          $ref: '#/components/schemas/OnboardingDraft'
        provenance:
          $ref: '#/components/schemas/OnboardingProvenance'
      additionalProperties: false
      type: object
      required:
      - draft
      - provenance
      title: OnboardingExtractionResponse
    OnboardingInventoryItem:
