openapi: 3.1.0
info:
  title: Noah Nvidia API
  version: 0.1.0
  description: Supervised run and approval API for Noah Nvidia.
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Service health
  /api/v1/bootstrap:
    get:
      operationId: bootstrap
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tenant-scoped business context and provider manifest
  /api/v1/conversations/{conversation_id}/messages:
    post:
      operationId: createMessage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageRequest"
      responses:
        "200":
          description: Run and assistant message
        "409":
          description: Idempotency key reused with different content
  /api/v1/runs/{run_id}:
    get:
      operationId: getRun
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Persisted run
  /api/v1/actions/{action_id}/{decision}:
    post:
      operationId: decideAction
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ActionId"
        - in: path
          name: decision
          required: true
          schema:
            type: string
            enum: [approve, reject]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: Idempotent action decision
        "404":
          description: Action is outside the tenant
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ConversationId:
      in: path
      name: conversation_id
      required: true
      schema: {type: string}
    RunId:
      in: path
      name: run_id
      required: true
      schema: {type: string}
    ActionId:
      in: path
      name: action_id
      required: true
      schema: {type: string}
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: {type: string, maxLength: 200}
  schemas:
    MessageRequest:
      type: object
      required: [message]
      properties:
        message: {type: string, minLength: 1, maxLength: 8000}
    DecisionRequest:
      type: object
      properties:
        reason: {type: string, maxLength: 500}
