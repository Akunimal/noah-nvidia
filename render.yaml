services:
  - type: web
    name: noah-nvidia-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
  - type: web
    name: noah-nvidia-api
    runtime: python
    rootDir: services/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: NOAH_REQUIRE_AUTH
        value: "true"
      - key: NOAH_DEMO_TOKEN
        sync: false
      - key: NOAH_DEMO_AUTH
        value: "true"
      - key: NOAH_PUBLIC_DEMO
        value: "true"
      - key: NOAH_ALLOW_SYNTHETIC_TENANTS
        value: "false"
      - key: NOAH_ALLOW_FREE_SYNTHETIC
        value: "false"
      - key: NOAH_PUBLIC_AI_MODE
        value: "scheduled"
      - key: NOAH_PUBLIC_AI_OPEN_AT
        value: "2026-10-27T17:00:00Z"
      - key: NOAH_PUBLIC_AI_DEADLINE_AT
        value: "2026-10-30T17:00:00Z"
      - key: NOAH_PUBLIC_MODEL_USAGE_LIMIT
        value: "20"
      - key: NOAH_PUBLIC_BYOK_USAGE_LIMIT
        value: "5"
      - key: NOAH_NEBIUS_BASE_URL
        value: "https://api.tokenfactory.nebius.com/v1"
      - key: NOAH_NEBIUS_MODEL
        value: "nvidia/nemotron-3-super-120b-a12b"
      - key: NOAH_NEBIUS_API_KEY
        sync: false
      - key: NOAH_OPENCODE2API_BASE_URL
        sync: false
      - key: NOAH_OPENCODE2API_KEY
        sync: false
      - key: NOAH_ENABLE_EXTERNAL_EFFECTS
        value: "false"
      - key: NOAH_ALLOWED_RECIPIENTS
        sync: false
      - key: NOAH_MODEL_USAGE_LIMIT
        value: "0"
      - key: NOAH_DATABASE_URL
        sync: false
      - key: NOAH_CONNECTION_ENCRYPTION_KEY
        sync: false
      - key: NOAH_JWT_SECRET
        sync: false
      - key: NOAH_CORS_ORIGINS
        sync: false
